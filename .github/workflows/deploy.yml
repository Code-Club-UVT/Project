name: Deployment

# push to main                  -> preprod (images tagged <sha> and latest)
# published GitHub Release      -> prod    (images tagged with the release tag only)
# any branch, started by hand   -> dev     (images tagged <sha>)
on:
    push:
        branches: [main]
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    # The image tag deploy.sh is given: the release tag for a release, the commit sha otherwise
    IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

concurrency:
    group: deploy-${{ github.event_name == 'release' && 'prod' || github.ref_name == 'main' && 'preprod' || 'dev' }}
    cancel-in-progress: false

jobs:
    build-images:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                    - { name: identity-api, dockerfile: identity-api/Dockerfile, target: api }
                    - { name: identity-api-migrate, dockerfile: identity-api/Dockerfile, target: migrate }
                    - { name: core-api, dockerfile: core-api/Dockerfile, target: api }
                    - { name: core-api-migrate, dockerfile: core-api/Dockerfile, target: migrate }
                    - { name: email-api, dockerfile: email-api/Dockerfile, target: api }
                    - { name: email-api-migrate, dockerfile: email-api/Dockerfile, target: migrate }
                    - { name: gateway, dockerfile: gateway/Dockerfile, target: "" }
                    - { name: mock-api, dockerfile: mock-api/Dockerfile, target: "" }

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Work out the image name (GHCR needs lowercase)
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  target: ${{ matrix.target }}
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ env.IMAGE_TAG }}
                      ${{ github.event_name == 'push' && github.ref_name == 'main' && format('{0}:latest', steps.image.outputs.name) || '' }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    deploy:
        needs: build-images
        runs-on: ubuntu-latest

        steps:
            - name: Pick the environment
              id: env
              run: |
                  if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
                    echo "name=prod" >> "$GITHUB_OUTPUT"
                  elif [ "${GITHUB_REF_NAME}" = "main" ]; then
                    echo "name=preprod" >> "$GITHUB_OUTPUT"
                  else
                    echo "name=dev" >> "$GITHUB_OUTPUT"
                  fi

            # The compose files, scripts and config live on the server in ~/codeclub-uvt (see its README); this only starts the new version.
            - name: Deploy on the server
              uses: appleboy/ssh-action@v1
              env:
                  GHCR_USER: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  key: ${{ secrets.PRIVATE_KEY }}
                  envs: GHCR_USER,GHCR_TOKEN
                  script: |
                      cd /home/${{ secrets.USERNAME }}/codeclub-uvt
                      sudo GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" bash scripts/deploy.sh ${{ steps.env.outputs.name }} ${{ env.IMAGE_TAG }}
