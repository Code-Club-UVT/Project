name: Deployment

# main            -> preprod
# releases/<name> -> prod
# any other branch, started by hand (Run workflow) -> dev
on:
    push:
        # TEMPORARY: lets this branch deploy to dev before the workflow exists on main (then "Run workflow" works). Remove afterwards.
        branches: [main, "releases/**", "barnie/core-api"]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: deploy-${{ github.ref_name == 'main' && 'preprod' || startsWith(github.ref_name, 'releases/') && 'prod' || 'dev' }}
    cancel-in-progress: false

jobs:
    build-images:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                include:
                    - { name: core-api, dockerfile: core-api/Dockerfile, target: api }
                    - { name: core-api-migrate, dockerfile: core-api/Dockerfile, target: migrate }
                    - { name: gateway, dockerfile: gateway/Dockerfile, target: "" }
                    - { name: mock-api, dockerfile: mock-api/Dockerfile, target: "" }

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Work out the image name (GHCR needs lowercase)
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  target: ${{ matrix.target }}
                  push: true
                  tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}

    deploy:
        needs: build-images
        runs-on: ubuntu-latest

        steps:
            - name: Pick the environment
              id: env
              run: |
                  case "${GITHUB_REF_NAME}" in
                    main) echo "name=preprod" >> "$GITHUB_OUTPUT" ;;
                    releases/*) echo "name=prod" >> "$GITHUB_OUTPUT" ;;
                    *) echo "name=dev" >> "$GITHUB_OUTPUT" ;;
                  esac

            # The compose files, scripts and config live on the server in ~/codeclub-uvt (see its README); this only starts the new version.
            - name: Deploy on the server
              uses: appleboy/ssh-action@v1
              env:
                  GHCR_USER: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  key: ${{ secrets.PRIVATE_KEY }}
                  envs: GHCR_USER,GHCR_TOKEN
                  script: |
                      cd /home/${{ secrets.USERNAME }}/codeclub-uvt
                      sudo GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" bash scripts/deploy.sh ${{ steps.env.outputs.name }} ${{ github.sha }}
