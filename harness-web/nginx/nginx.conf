# The harness container: serves the built app and forwards /api to the gateway over the private network.
# Everything writable lives in /tmp (a tmpfs), so the container can run with a read-only root filesystem.
# entrypoint.sh renders /tmp/site (the app with its config) and /tmp/harness/*.conf before nginx starts.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Slow or oversized requests are dropped before they reach the gateway.
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 1m;
    large_client_header_buffers 4 8k;

    # Caddy (the only thing that can reach this container) sets X-Forwarded-For to the real client address.
    # Take it as the client address, so the logs and the rate limit see the user and not the proxy.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # First line of defence in front of the gateway's own per-IP limit on the account endpoints.
    limit_req_zone $binary_remote_addr zone=auth:2m rate=20r/m;
    limit_req_status 429;

    server {
        listen 8080 default_server;
        server_name _;
        root /tmp/site;

        # Only for the container's own health check; from anywhere else it looks like any unknown path.
        # (allow/deny would not work here: "return" runs before the access phase.)
        location = /healthz {
            access_log off;
            if ($remote_addr != 127.0.0.1) {
                return 404;
            }
            default_type text/plain;
            return 200 "ok\n";
        }

        # /api (and /health in the open mode): see api-open.conf and api-restricted.conf.
        include /tmp/harness/api.conf;

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            include /etc/harness/security-headers.conf;
            add_header Cache-Control "public, immutable" always;
        }

        # The app and its small settings files are never cached: a new deploy takes effect at once.
        location / {
            try_files $uri $uri/ /index.html;
            include /etc/harness/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
    }
}
