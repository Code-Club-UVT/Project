# HARNESS_API_MODE=restricted (preprod, prod): only /api reaches the gateway, with the usual HTTP methods.
# /health and the OpenAPI schemas are not public (404). Real protection stays in the gateway (tokens, access check,
# rate limits); this only keeps everything else off the internet and drops obvious abuse early.

location = /health {
    return 404;
}

# OpenAPI schemas (/api/openapi/..., /api/<slug>/openapi/...) stay private until it is decided how they are published.
location ~* ^/api/(openapi|[^/]+/openapi)(/|$) {
    return 404;
}

location ~* ^/api/identity/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_except GET HEAD POST OPTIONS {
        deny all;
    }
    include /tmp/harness/api-proxy.conf;
}

location /api/ {
    limit_except GET HEAD POST PUT PATCH DELETE OPTIONS {
        deny all;
    }
    include /tmp/harness/api-proxy.conf;
}
