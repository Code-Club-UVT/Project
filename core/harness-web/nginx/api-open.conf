# HARNESS_API_MODE=open (dev): the whole gateway surface is reachable, for Postman and for looking around.
# /health and the OpenAPI schemas answer; nothing here is blocked.

location = /health {
    include /tmp/harness/api-proxy.conf;
}

location ~* ^/api/identity/auth/ {
    limit_req zone=auth burst=10 nodelay;
    include /tmp/harness/api-proxy.conf;
}

location /api/ {
    include /tmp/harness/api-proxy.conf;
}
