# Headers of /apps/<slug>/ responses (the static frontends of the projects, shown in iframes of the harness).
# Included in the /apps/ location (add_header is not inherited once a location has its own). The apps are first-party and
# built without inline scripts; they call the API through the harness (same origin), so 'self' is enough everywhere.
# The harness page itself keeps frame-ancestors 'none' (security-headers.conf); only the same origin may frame an app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
