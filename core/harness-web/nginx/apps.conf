# /apps/<slug>/...: the static frontends of the projects. The gateway serves them (its /apps/<slug> routes come from the
# project's FrontendUrl); this only forwards them, GET and HEAD only, compressed. Included in every API mode.
# The gateway's own headers are replaced by apps-headers.conf (the app's upstream may send its own X-Frame-Options).

location /apps/ {
    limit_except GET HEAD {
        deny all;
    }
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Set-Cookie;
    include /etc/harness/apps-headers.conf;
    include /tmp/harness/api-proxy.conf;
}
