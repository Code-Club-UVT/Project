# Shared proxy settings for the gateway. __GATEWAY_URL__ is replaced by entrypoint.sh (HARNESS_GATEWAY_URL).
# The address is a variable with a resolver, so nginx starts even if the gateway is not up yet and follows its restarts.
resolver 127.0.0.11 valid=10s ipv6=off;
set $gateway "__GATEWAY_URL__";

proxy_pass $gateway;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# One value, never what the client sent: the gateway takes it as the client address (it trusts this container's network).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
